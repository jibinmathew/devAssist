name: DevPilot CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || true

      - name: Build DevPilot Scheme
        run: |
          xcodebuild -project DevAssist.xcodeproj \
                     -scheme DevAssist \
                     -sdk iphonesimulator \
                     -destination 'platform=iOS Simulator,name=iPhone 16' \
                     clean build

      - name: Run DevPilot Unit Test Suite
        run: |
          xcodebuild -project DevAssist.xcodeproj \
                     -scheme DevAssist \
                     -sdk iphonesimulator \
                     -destination 'platform=iOS Simulator,name=iPhone 16' \
                     test
